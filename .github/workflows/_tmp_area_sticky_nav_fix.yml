name: Temporary Area sticky nav fix

on:
  push:
    branches:
      - chore/area-sticky-nav-offset

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch sticky navigation offset
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/components/AreaExperience.astro")
          text = path.read_text()
          old = 'class="sticky top-[68px] z-20'
          new = 'class="sticky top-[81px] z-20'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one sticky-nav target, found {count}")

          path.write_text(text.replace(old, new, 1))
          print("Updated Area sticky nav top: 68px -> 81px")
          PY

      - name: Commit fix directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AreaExperience.astro
          git commit -m "fix(area): align sticky nav below main navbar"
          git push origin HEAD:main
