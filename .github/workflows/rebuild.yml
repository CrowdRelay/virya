name: Scheduled rebuild

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  trigger-build:
    runs-on: [self-hosted, arm64, frontend]
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Dispatch the main build workflow, which builds, tests, and
            // promotes the artifact to Netlify. The promote job runs
            // automatically on workflow_dispatch from main.
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'main',
            });
