name: Lighthouse (full)

# Full-route Lighthouse sweep: every prerendered page in dist/, once nightly
# and on demand. The push gate (lighthouse.yml) covers a representative subset
# at 3-run medians; this covers the long tail — lyrics/music/legal/PL mirrors —
# at 1 run each so the whole surface stays honest without taxing every push.
on:
  schedule:
    - cron: "23 3 * * *" # 03:23 UTC — off-peak on the shared runner box
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse-full:
    name: Lighthouse full sweep
    runs-on: [self-hosted, arm64, frontend]
    # ~70 routes × 1 run × ~45s on the ARM box ≈ 55 min; headroom for
    # cold npm/playwright caches.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/virya-images
            public/resp
          key: images-${{ runner.os }}-${{ hashFiles('scripts/gen-placeholders.mjs', 'public/**/*') }}
          restore-keys: |
            images-${{ runner.os }}-

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build production output
        run: npm run build
        env:
          CI: "true"
          VIRYA_SOURCE_SHA: ${{ github.sha }}

      - name: Install Chromium for Lighthouse
        # Same mechanism as lighthouse.yml — Playwright ships linux/arm64
        # chromium and chrome-launcher honors CHROME_PATH.
        run: |
          set -euo pipefail
          npm --prefix "${RUNNER_TEMP}/pw" install --no-audit --no-fund playwright@1.49.1
          "${RUNNER_TEMP}/pw/node_modules/.bin/playwright" install --with-deps chromium
          chrome_path="$(find "$HOME/.cache/ms-playwright" -type f -path '*chrome-linux/chrome' | head -1)"
          test -x "${chrome_path}"
          echo "CHROME_PATH=${chrome_path}" >> "${GITHUB_ENV}"

      - name: Run Lighthouse CI (full matrix)
        run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          LHCI_FULL: "1"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-full-report
          path: .lighthouseci
          retention-days: 14
