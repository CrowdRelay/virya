name: Upstream contract

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"
  push:
    branches: [main]
    paths:
      - "src/lib/crowdrelay-client.ts"
      - "src/server/crowdrelayArea.ts"
      - "src/server/crowdrelayCommerce.ts"
      - "src/server/crowdrelayTicketing.ts"
      - "src/server/liveEvents.ts"
      - "src/server/staffQrApi.ts"
      - "scripts/**"
      - ".github/workflows/upstream-contract.yml"
  pull_request:
    paths:
      - "src/lib/crowdrelay-client.ts"
      - "src/server/crowdrelayArea.ts"
      - "src/server/crowdrelayCommerce.ts"
      - "src/server/crowdrelayTicketing.ts"
      - "src/server/liveEvents.ts"
      - "src/server/staffQrApi.ts"
      - "scripts/**"
      - ".github/workflows/upstream-contract.yml"

permissions:
  contents: read

concurrency:
  group: virya-upstream-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crowdrelay:
    name: CrowdRelay compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Virya under canonical ecosystem layout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: virya

      - name: Check out current CrowdRelay main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrowdRelay/crowdrelay
          ref: main
          path: crowdrelay
          persist-credentials: false

      - name: Verify Virya against current upstream OpenAPI and AREA handoff
        id: contract
        run: python3 crowdrelay/scripts/test-ecosystem-contract-v2.py

      # If the scheduled/polling check detects drift, trigger the
      # contract-propagate workflow to auto-fix the SHA marker and open a PR.
      # This only runs on the default branch (not on PRs — a PR failing
      # the contract test is the developer's signal to fix it manually).
      - name: Trigger auto-fix on drift
        if: failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OPENAPI_SHA="$(sha256sum crowdrelay/openapi/openapi.yaml | awk '{print $1}')"
          echo "Contract drift detected on polling check — triggering contract-propagate"
          gh workflow run contract-propagate.yml \
            -f openapi_sha="$OPENAPI_SHA" \
            || echo "WARN: could not trigger contract-propagate workflow"
