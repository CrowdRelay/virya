name: Upstream contract

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"
  push:
    branches: [main]
    paths:
      - "src/lib/crowdrelay-client.ts"
      - "src/server/crowdrelayArea.ts"
      - "scripts/**"
      - ".github/workflows/upstream-contract.yml"
  pull_request:
    paths:
      - "src/lib/crowdrelay-client.ts"
      - "src/server/crowdrelayArea.ts"
      - "scripts/**"
      - ".github/workflows/upstream-contract.yml"

permissions:
  contents: read

concurrency:
  group: virya-upstream-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crowdrelay:
    name: CrowdRelay compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Virya under canonical ecosystem layout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: virya

      - name: Check out current CrowdRelay main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wojciechbator/crowdrelay
          ref: main
          path: crowdrelay
          persist-credentials: false

      - name: Verify Virya against current upstream OpenAPI and AREA handoff
        run: python3 crowdrelay/scripts/test-ecosystem-contract-v2.py
