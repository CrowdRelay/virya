# actions-recovery: 20260806-201024
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            .cache/virya-images
            public/resp
          key: images-${{ runner.os }}-${{ hashFiles('scripts/gen-placeholders.mjs', 'public/**/*') }}
          restore-keys: |
            images-${{ runner.os }}-
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Unit, contract, asset and type gates
        run: npm test
      - name: Build production output
        run: npm run build
        env:
          CI: "true"
      - name: Enforce production code budget
        run: npm run budget:build

      - name: Verify Netlify deploy artifacts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -n "$(find dist -type f -print -quit)"

          if [[ -d .netlify/functions-internal ]]; then
            functions_dir=.netlify/functions-internal
          elif [[ -d .netlify/v1/functions ]]; then
            functions_dir=.netlify/v1/functions
          else
            echo "Netlify function artifacts are missing after the Astro build." >&2
            find .netlify -maxdepth 3 -type f -print 2>/dev/null | sort | head -200 >&2 || true
            exit 1
          fi

          test -n "$(find "$functions_dir" -type f -print -quit)"
          echo "VIRYA_NETLIFY_ARTIFACT=PASS static=$(find dist -type f | wc -l | tr -d ' ') functions=$(find "$functions_dir" -type f | wc -l | tr -d ' ')"

      - name: Verify Netlify source builds are stopped
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN}"
          test -n "${NETLIFY_SITE_ID}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}" \
            -o "${RUNNER_TEMP}/netlify-site.json"
          python3 - "${RUNNER_TEMP}/netlify-site.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          data = json.loads(Path(sys.argv[1]).read_text())
          stopped = bool((data.get("build_settings") or {}).get("stop_builds"))
          if not stopped:
              raise SystemExit(
                  "VIRYA_NETLIFY_ZERO_BUILD=FAIL reason=source-builds-active "
                  "action='Netlify > Project configuration > Build & deploy > Build settings > Stopped builds'"
              )
          print("VIRYA_NETLIFY_ZERO_BUILD=PASS source_builds=stopped deploy=manual-cli")
          PY

      - name: Deploy prebuilt output to Netlify
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .netlify/functions-internal ]]; then
            functions_dir=.netlify/functions-internal
          elif [[ -d .netlify/v1/functions ]]; then
            functions_dir=.netlify/v1/functions
          else
            echo "Netlify function artifacts are missing; refusing static-only deploy." >&2
            exit 1
          fi

          npx --yes netlify-cli@26.2.0 deploy \
            --prod \
            --no-build \
            --dir=dist \
            --functions="${functions_dir}" \
            --site="${NETLIFY_SITE_ID}" \
            --auth="${NETLIFY_AUTH_TOKEN}" \
            --message="GitHub Actions ${GITHUB_SHA}"
