name: Build and promote

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/virya-images
            public/resp
          key: images-${{ runner.os }}-${{ hashFiles('scripts/gen-placeholders.mjs', 'public/**/*') }}
          restore-keys: |
            images-${{ runner.os }}-
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      # Keep the per-change security gate fail-closed, but run it in the job
      # that already owns node_modules. GitHub jobs do not share a filesystem;
      # the former dependency-security job paid for a second identical npm ci.
      - name: Audit high and critical dependency advisories
        run: npm run security:audit
      - name: Unit, contract, asset and type gates
        run: npm test
      - name: Build production output
        run: npm run build
        env:
          CI: "true"
      - name: Enforce production code budget
        run: npm run budget:build
      - name: Record and compare production build metrics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/previous
          python3 scripts/build_metrics.py dist artifacts/build-metrics.json
          previous_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=main&status=success&per_page=10" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [[ -n "${previous_run}" ]]; then
            # Retry once: artifact propagation right after a run finishes is
            # occasionally slow, and silently skipping the ratchet on a
            # transient download error hides real regressions.
            gh run download "${previous_run}" --repo "${GITHUB_REPOSITORY}" -n virya-build-metrics -D artifacts/previous >/dev/null 2>&1 \
              || gh run download "${previous_run}" --repo "${GITHUB_REPOSITORY}" -n virya-build-metrics -D artifacts/previous >/dev/null 2>&1 \
              || true
          fi
          if [[ -s artifacts/previous/build-metrics.json ]]; then
            python3 scripts/compare_build_metrics.py artifacts/build-metrics.json artifacts/previous/build-metrics.json
          else
            # Pass-on-missing-baseline stays (first runs have no baseline), but
            # the inactive ratchet must be visible, never silent.
            echo "::warning::Build-regression ratchet INACTIVE: no virya-build-metrics baseline could be fetched (run: ${previous_run:-none}). Size regressions are NOT being compared for this build."
            echo "VIRYA_BUILD_REGRESSION=BASELINE_PENDING"
          fi
      - name: Upload build metrics baseline
        # An earlier quality/build failure legitimately means metrics were never
        # produced. Do not mask the real failure with a second artifact error.
        # Observability only: a storage-quota cap must never fail the build over
        # a baseline the ratchet already tolerates missing.
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virya-build-metrics
          path: artifacts/build-metrics.json
          if-no-files-found: warn
          retention-days: 7

      - name: Purge stale artifacts before upload
        # Actions storage quota is account-wide and recalculated every 6-12h.
        # Old virya-netlify-* artifacts from previous main pushes linger until
        # retention expires; deleting them before the upload frees quota and
        # avoids a hard block on the current run's promotion artifact.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Delete all artifacts from previous runs except the current run.
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | .id" 2>/dev/null || true)
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" 2>/dev/null || true
          done
          echo "Purged ${#ids[@]} stale artifact(s)"

      - name: Assemble immutable Netlify promotion artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -n "$(find dist -type f -print -quit)"

          if [[ -d .netlify/functions-internal ]]; then
            functions_dir=.netlify/functions-internal
          elif [[ -d .netlify/v1/functions ]]; then
            functions_dir=.netlify/v1/functions
          else
            echo "Netlify function artifacts are missing after the Astro build." >&2
            find .netlify -maxdepth 3 -type f -print 2>/dev/null | sort | head -200 >&2 || true
            exit 1
          fi
          test -n "$(find "$functions_dir" -type f -print -quit)"

          rm -rf deploy-artifact
          mkdir -p deploy-artifact/site deploy-artifact/functions
          cp -a dist/. deploy-artifact/site/
          cp -a "$functions_dir"/. deploy-artifact/functions/
          python3 scripts/artifact_manifest.py create deploy-artifact deploy-artifact-manifest.json --source-sha "${GITHUB_SHA}"
          python3 scripts/artifact_manifest.py verify deploy-artifact deploy-artifact-manifest.json --source-sha "${GITHUB_SHA}"
          python3 scripts/write_release_provenance.py \
            --source-sha "${GITHUB_SHA}" \
            --lockfile package-lock.json \
            --artifact-manifest deploy-artifact-manifest.json \
            --output release-provenance.json
          # Archive the deploy tree into a single zstd-compressed tarball.
          # upload-artifact stores 1262 separate files per run otherwise, and
          # the per-file metadata overhead plus 7-day retention pushed the
          # repo over the Actions storage quota. A single tar.zst is ~3x
          # smaller and one artifact entry.
          tar --zstd -cf deploy-artifact.tar.zst -C deploy-artifact .
          echo "VIRYA_NETLIFY_ARTIFACT=PASS static=$(find deploy-artifact/site -type f | wc -l | tr -d ' ') functions=$(find deploy-artifact/functions -type f | wc -l | tr -d ' ') archive=$(stat -c%s deploy-artifact.tar.zst) bytes"

      - name: Upload immutable Netlify promotion artifact
        # Promotion on every main push downloads exactly this artifact, so a
        # failed upload must fail the build loudly — silent skips produced
        # green CI with stale production once already.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virya-netlify-${{ github.sha }}
          path: |
            deploy-artifact.tar.zst
            deploy-artifact-manifest.json
            release-provenance.json
            scripts/artifact_manifest.py
            scripts/write_release_provenance.py
          retention-days: 7

  deploy:
    name: Promote exact build artifact to Netlify
    needs: build
    # Routine main pushes promote automatically: green CI now means the exact,
    # provenance-verified artifact is live on production. workflow_dispatch
    # remains available for deliberate re-promotion of an older artifact.
    # Routine main pushes promote automatically: green CI means the exact,
    # provenance-verified artifact is live on production. workflow_dispatch
    # remains for deliberate re-promotion of an older artifact.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: virya-netlify-${{ github.sha }}
          path: promoted

      - name: Extract deploy artifact archive
        shell: bash
        run: |
          set -euo pipefail
          test -s promoted/deploy-artifact.tar.zst
          mkdir -p promoted/deploy-artifact
          tar --zstd -xf promoted/deploy-artifact.tar.zst -C promoted/deploy-artifact
          test -s promoted/deploy-artifact/site/index.html

      - name: Verify immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s promoted/deploy-artifact/site/index.html
          test -n "$(find promoted/deploy-artifact/functions -type f -print -quit)"
          python3 promoted/scripts/artifact_manifest.py verify \
            promoted/deploy-artifact \
            promoted/deploy-artifact-manifest.json \
            --source-sha "${GITHUB_SHA}"
          python3 - promoted/release-provenance.json "${GITHUB_SHA}" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1]))
          if data.get("sourceSha") != sys.argv[2]: raise SystemExit("release provenance source mismatch")
          for key in ("dependencyLockSha256", "artifactManifestSha256"):
              if not re.fullmatch(r"[0-9a-f]{64}", str(data.get(key, ""))):
                  raise SystemExit(f"invalid {key}")
          print("VIRYA_DEPLOY_PROVENANCE=PASS source=" + data["sourceSha"] + " rebuild=false")
          PY

      - name: Verify Netlify source builds are stopped
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN}"
          test -n "${NETLIFY_SITE_ID}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}" \
            -o "${RUNNER_TEMP}/netlify-site.json"
          python3 - "${RUNNER_TEMP}/netlify-site.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          data = json.loads(Path(sys.argv[1]).read_text())
          stopped = bool((data.get("build_settings") or {}).get("stop_builds"))
          if not stopped:
              raise SystemExit(
                  "VIRYA_NETLIFY_ZERO_BUILD=FAIL reason=source-builds-active "
                  "action='Netlify > Project configuration > Build & deploy > Build settings > Stopped builds'"
              )
          print("VIRYA_NETLIFY_ZERO_BUILD=PASS source_builds=stopped deploy=artifact-promotion")
          PY

      - name: Refuse stale production promotion
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          [[ "${current_sha}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${current_sha}" == "${GITHUB_SHA}" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "VIRYA_DEPLOY_FRESHNESS=SKIP artifact=${GITHUB_SHA} main=${current_sha}"
          fi

      - name: Setup Node.js for Netlify CLI
        if: steps.freshness.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Deploy exact prebuilt artifact
        if: steps.freshness.outputs.current == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes netlify-cli@26.2.0 deploy \
            --prod \
            --no-build \
            --dir=promoted/deploy-artifact/site \
            --functions=promoted/deploy-artifact/functions \
            --site="${NETLIFY_SITE_ID}" \
            --auth="${NETLIFY_AUTH_TOKEN}" \
            --message="GitHub Actions artifact ${GITHUB_SHA}"

      - name: Verify production Android App Links
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/assetlinks.json"
          headers="${RUNNER_TEMP}/assetlinks.headers"
          # Two different states must not be conflated. Play App Signing may
          # simply not be enabled yet, in which case the endpoint fails closed
          # with 503 and says so explicitly; that is a known state, not a broken
          # deploy, and it must not block shipping the site. Once a fingerprint
          # is configured the document has to be valid, and anything malformed
          # is a hard failure because Android would silently fall back to the
          # browser for Latarnik and My Signal links.
          for attempt in $(seq 1 10); do
            code="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --max-time 10 --dump-header "${headers}" \
              --write-out '%{http_code}' \
              'https://virya.music/.well-known/assetlinks.json' -o "${target}" || true)"
            if [[ "${code}" == "503" ]] \
              && grep -qi '^x-virya-app-links:[[:space:]]*unconfigured' "${headers}"; then
              echo 'VIRYA_ANDROID_APP_LINKS=UNCONFIGURED Play signing fingerprint is not set; App Links stay disabled'
              exit 0
            fi
            if [[ "${code}" == "200" ]]; then
              if python3 - "${target}" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1]))
          pattern = re.compile(r"^(?:[0-9A-F]{2}:){31}[0-9A-F]{2}$")
          if not isinstance(data, list) or not data:
              raise SystemExit(1)
          matches = [
              item for item in data
              if isinstance(item, dict)
              and item.get("relation") == ["delegate_permission/common.handle_all_urls"]
              and isinstance(item.get("target"), dict)
              and item["target"].get("namespace") == "android_app"
              and item["target"].get("package_name") == "music.virya.signal"
          ]
          if len(matches) != 1:
              raise SystemExit(1)
          fingerprints = matches[0]["target"].get("sha256_cert_fingerprints")
          if not isinstance(fingerprints, list) or not fingerprints or not all(
              isinstance(value, str) and pattern.fullmatch(value) for value in fingerprints
          ):
              raise SystemExit(1)
          print(f"VIRYA_ANDROID_APP_LINKS=PASS fingerprints={len(fingerprints)}")
          PY
              then
                exit 0
              fi
              echo 'VIRYA_ANDROID_APP_LINKS=FAIL production assetlinks is served but invalid' >&2
              exit 1
            fi
            sleep 3
          done
          echo 'VIRYA_ANDROID_APP_LINKS=FAIL production assetlinks is unreachable' >&2
          exit 1

      - name: Report Virya release to CrowdRelay ledger
        if: steps.freshness.outputs.current == 'true'
        continue-on-error: true
        env:
          CROWDRELAY_BASE_URL: ${{ secrets.CROWDRELAY_BASE_URL }}
          CROWDRELAY_COMMERCE_API_KEY: ${{ secrets.CROWDRELAY_COMMERCE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CROWDRELAY_BASE_URL:-}" || -z "${CROWDRELAY_COMMERCE_API_KEY:-}" ]]; then
            echo "VIRYA_RELEASE_LEDGER=SKIP reason=not-configured"
            exit 0
          fi
          lock_sha="$(jq -r '.dependencyLockSha256' promoted/release-provenance.json)"
          manifest_sha="$(jq -r '.artifactManifestSha256' promoted/release-provenance.json)"
          [[ "${lock_sha}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${manifest_sha}" =~ ^[0-9a-f]{64}$ ]]
          jq -n --arg sha "${GITHUB_SHA}" --arg ref "${GITHUB_RUN_ID}" --arg lock "${lock_sha}" --arg artifact_manifest "${manifest_sha}" '{component_key:"virya-www",environment:"production",source_sha:$sha,artifact_digest:("sha256:"+$artifact_manifest),deploy_ref:$ref,version:null,manifest_sha:null,metadata:{reporter:"github-actions",dependency_lock_sha256:$lock,artifact_manifest_sha256:$artifact_manifest},observed_at:(now|todateiso8601)}' | \
            curl --fail-with-body --silent --show-error --max-time 15 \
              -H 'content-type: application/json' \
              -H "Authorization: Bearer ${CROWDRELAY_COMMERCE_API_KEY}" \
              --data-binary @- "${CROWDRELAY_BASE_URL%/}/v1/internal/autopilot/release-components"
          echo "VIRYA_RELEASE_LEDGER=PASS sha=${GITHUB_SHA}"
