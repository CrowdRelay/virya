# actions-recovery: 20260806-201024
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            .cache/virya-images
            public/resp
          key: images-${{ runner.os }}-${{ hashFiles('scripts/gen-placeholders.mjs', 'public/**/*') }}
          restore-keys: |
            images-${{ runner.os }}-
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Unit, contract, asset and type gates
        run: npm test
      - name: Build production output
        run: npm run build
        env:
          CI: "true"
      - name: Enforce production code budget
        run: npm run budget:build
