name: Build and promote

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/virya-images
            public/resp
          key: images-${{ runner.os }}-${{ hashFiles('scripts/gen-placeholders.mjs', 'public/**/*') }}
          restore-keys: |
            images-${{ runner.os }}-
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Audit high and critical dependency advisories
        run: npm run security:audit
      - name: Unit, contract, asset and type gates
        run: npm test
      - name: Build production output
        run: npm run build
        env:
          CI: "true"
      - name: Enforce production code budget
        run: npm run budget:build
      - name: Record and compare production build metrics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/previous
          python3 scripts/build_metrics.py dist artifacts/build-metrics.json
          previous_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=main&status=success&per_page=10" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [[ -n "${previous_run}" ]]; then
            gh run download "${previous_run}" --repo "${GITHUB_REPOSITORY}" -n virya-build-metrics -D artifacts/previous >/dev/null 2>&1 || true
          fi
          if [[ -s artifacts/previous/build-metrics.json ]]; then
            python3 scripts/compare_build_metrics.py artifacts/build-metrics.json artifacts/previous/build-metrics.json
          else
            echo "VIRYA_BUILD_REGRESSION=BASELINE_PENDING"
          fi
      - name: Upload build metrics baseline
        # An earlier quality/build failure legitimately means metrics were never
        # produced. Do not mask the real failure with a second artifact error.
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: virya-build-metrics
          path: artifacts/build-metrics.json
          if-no-files-found: warn
          retention-days: 90

      - name: Assemble immutable Netlify promotion artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -n "$(find dist -type f -print -quit)"

          if [[ -d .netlify/functions-internal ]]; then
            functions_dir=.netlify/functions-internal
          elif [[ -d .netlify/v1/functions ]]; then
            functions_dir=.netlify/v1/functions
          else
            echo "Netlify function artifacts are missing after the Astro build." >&2
            find .netlify -maxdepth 3 -type f -print 2>/dev/null | sort | head -200 >&2 || true
            exit 1
          fi
          test -n "$(find "$functions_dir" -type f -print -quit)"

          rm -rf deploy-artifact
          mkdir -p deploy-artifact/site deploy-artifact/functions
          cp -a dist/. deploy-artifact/site/
          cp -a "$functions_dir"/. deploy-artifact/functions/
          python3 scripts/artifact_manifest.py create deploy-artifact deploy-artifact-manifest.json --source-sha "${GITHUB_SHA}"
          python3 scripts/artifact_manifest.py verify deploy-artifact deploy-artifact-manifest.json --source-sha "${GITHUB_SHA}"
          python3 scripts/write_release_provenance.py \
            --source-sha "${GITHUB_SHA}" \
            --lockfile package-lock.json \
            --artifact-manifest deploy-artifact-manifest.json \
            --output release-provenance.json
          echo "VIRYA_NETLIFY_ARTIFACT=PASS static=$(find deploy-artifact/site -type f | wc -l | tr -d ' ') functions=$(find deploy-artifact/functions -type f | wc -l | tr -d ' ')"

      - name: Upload immutable Netlify promotion artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: virya-netlify-${{ github.sha }}
          path: |
            deploy-artifact
            deploy-artifact-manifest.json
            release-provenance.json
            scripts/artifact_manifest.py
            scripts/write_release_provenance.py
          # Astro's Netlify SSR bundle contains required files below
          # functions/ssr/.netlify; upload-artifact excludes them by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Promote exact build artifact to Netlify
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: virya-netlify-${{ github.sha }}
          path: promoted

      - name: Verify immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s promoted/deploy-artifact/site/index.html
          test -n "$(find promoted/deploy-artifact/functions -type f -print -quit)"
          python3 promoted/scripts/artifact_manifest.py verify \
            promoted/deploy-artifact \
            promoted/deploy-artifact-manifest.json \
            --source-sha "${GITHUB_SHA}"
          python3 - promoted/release-provenance.json "${GITHUB_SHA}" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1]))
          if data.get("sourceSha") != sys.argv[2]: raise SystemExit("release provenance source mismatch")
          for key in ("dependencyLockSha256", "artifactManifestSha256"):
              if not re.fullmatch(r"[0-9a-f]{64}", str(data.get(key, ""))):
                  raise SystemExit(f"invalid {key}")
          print("VIRYA_DEPLOY_PROVENANCE=PASS source=" + data["sourceSha"] + " rebuild=false")
          PY

      - name: Verify Netlify source builds are stopped
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN}"
          test -n "${NETLIFY_SITE_ID}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}" \
            -o "${RUNNER_TEMP}/netlify-site.json"
          python3 - "${RUNNER_TEMP}/netlify-site.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          data = json.loads(Path(sys.argv[1]).read_text())
          stopped = bool((data.get("build_settings") or {}).get("stop_builds"))
          if not stopped:
              raise SystemExit(
                  "VIRYA_NETLIFY_ZERO_BUILD=FAIL reason=source-builds-active "
                  "action='Netlify > Project configuration > Build & deploy > Build settings > Stopped builds'"
              )
          print("VIRYA_NETLIFY_ZERO_BUILD=PASS source_builds=stopped deploy=artifact-promotion")
          PY

      - name: Refuse stale production promotion
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          [[ "${current_sha}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${current_sha}" == "${GITHUB_SHA}" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "VIRYA_DEPLOY_FRESHNESS=SKIP artifact=${GITHUB_SHA} main=${current_sha}"
          fi

      - name: Setup Node.js for Netlify CLI
        if: steps.freshness.outputs.current == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Deploy exact prebuilt artifact
        if: steps.freshness.outputs.current == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes netlify-cli@26.2.0 deploy \
            --prod \
            --no-build \
            --dir=promoted/deploy-artifact/site \
            --functions=promoted/deploy-artifact/functions \
            --site="${NETLIFY_SITE_ID}" \
            --auth="${NETLIFY_AUTH_TOKEN}" \
            --message="GitHub Actions artifact ${GITHUB_SHA}"

      - name: Report Virya release to CrowdRelay ledger
        if: steps.freshness.outputs.current == 'true'
        continue-on-error: true
        env:
          CROWDRELAY_BASE_URL: ${{ vars.CROWDRELAY_PRODUCTION_BASE_URL }}
          CROWDRELAY_COMMERCE_API_KEY: ${{ secrets.CROWDRELAY_COMMERCE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CROWDRELAY_BASE_URL:-}" || -z "${CROWDRELAY_COMMERCE_API_KEY:-}" ]]; then
            echo "VIRYA_RELEASE_LEDGER=SKIP reason=not-configured"
            exit 0
          fi
          lock_sha="$(jq -r '.dependencyLockSha256' promoted/release-provenance.json)"
          manifest_sha="$(jq -r '.artifactManifestSha256' promoted/release-provenance.json)"
          [[ "${lock_sha}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${manifest_sha}" =~ ^[0-9a-f]{64}$ ]]
          jq -n --arg sha "${GITHUB_SHA}" --arg ref "${GITHUB_RUN_ID}" --arg lock "${lock_sha}" --arg artifact_manifest "${manifest_sha}" '{component_key:"virya-www",environment:"production",source_sha:$sha,artifact_digest:("sha256:"+$artifact_manifest),deploy_ref:$ref,version:null,manifest_sha:null,metadata:{reporter:"github-actions",dependency_lock_sha256:$lock,artifact_manifest_sha256:$artifact_manifest},observed_at:(now|todateiso8601)}' | \
            curl --fail-with-body --silent --show-error --max-time 15 \
              -H 'content-type: application/json' \
              -H "Authorization: Bearer ${CROWDRELAY_COMMERCE_API_KEY}" \
              --data-binary @- "${CROWDRELAY_BASE_URL%/}/v1/internal/autopilot/release-components"
          echo "VIRYA_RELEASE_LEDGER=PASS sha=${GITHUB_SHA}"
