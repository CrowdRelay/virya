name: Dependency security

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Generate deterministic lock SBOM
        run: python3 scripts/generate_lock_sbom.py package-lock.json artifacts/virya-sbom.cdx.json
      - name: Upload dependency SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virya-sbom-${{ github.sha }}
          path: artifacts/virya-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Audit high and critical dependency advisories
        run: npm run security:audit
