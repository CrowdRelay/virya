name: Dependency security

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Generate deterministic lock SBOM
        run: python3 scripts/generate_lock_sbom.py package-lock.json artifacts/virya-sbom.cdx.json
      - name: Upload dependency SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: virya-sbom-${{ github.sha }}
          path: artifacts/virya-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Audit high and critical dependency advisories
        run: npm run security:audit
