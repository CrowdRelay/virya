[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers live in public/_headers (single source of truth); on conflict
# Netlify's _headers wins, so they are not duplicated here.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, s-maxage=31536000, max-age=0, must-revalidate"

[[headers]]
  for = "/pl/"
  [headers.values]
    Cache-Control = "public, s-maxage=31536000, max-age=0, must-revalidate"

[[headers]]
  for = "/merch/"
  [headers.values]
    Cache-Control = "public, s-maxage=31536000, max-age=0, must-revalidate"

[[headers]]
  for = "/pl/merch/"
  [headers.values]
    Cache-Control = "public, s-maxage=31536000, max-age=0, must-revalidate"

[[headers]]
  for = "/about/"
  [headers.values]
    Cache-Control = "public, s-maxage=31536000, max-age=0, must-revalidate"

[[headers]]
  for = "/pl/about/"
  [headers.values]
    Cache-Control = "public, s-maxage=31536000, max-age=0, must-revalidate"

[[headers]]
  for = "/music/*"
  [headers.values]
    Cache-Control = "public, s-maxage=31536000, max-age=0, must-revalidate"

[[headers]]
  for = "/pl/music/*"
  [headers.values]
    Cache-Control = "public, s-maxage=31536000, max-age=0, must-revalidate"

[[headers]]
  for = "/api/bandsintown"
  [headers.values]
    Cache-Control = "public, max-age=1800, stale-while-revalidate=3600"

[[headers]]
  for = "/covers/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
