[build]
  publish = "dist"

  # Production is built and deployed by GitHub Actions. Netlify must never
  # spend build minutes on Git-triggered source builds. Keep Build status
  # set to "Stopped builds" in Netlify; this ignore rule is defense in depth.
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"

# Security headers live in public/_headers (single source of truth); on conflict
# Netlify's _headers wins, so they are not duplicated here.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, s-maxage=31536000, max-age=0, must-revalidate"

[[headers]]
  for = "/pl/"
  [headers.values]
    Cache-Control = "public, s-maxage=31536000, max-age=0, must-revalidate"

[[headers]]
  for = "/merch/"
  [headers.values]
    Cache-Control = "public, s-maxage=31536000, max-age=0, must-revalidate"

[[headers]]
